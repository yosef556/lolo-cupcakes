server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: lolo-cupcakes-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lolo_cupcakes}
    username: ${SPRING_DATASOURCE_USERNAME:lolo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:lolo_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Cairo
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Cairo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET:4a6f6c6f43757063616b65735365637265744b6579323032365072656d69756d4465737365727473}
    expiration-ms: 86400000
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    private-dir: ${PRIVATE_UPLOAD_DIR:uploads/private}
