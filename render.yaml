services:
  - type: web
    name: lolo-cupcakes-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: lolo-cupcakes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: lolo-cupcakes-db
    databaseName: lolo_cupcakes
    user: lolo_user
    plan: free
    region: frankfurt
